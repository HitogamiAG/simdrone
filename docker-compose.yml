services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: uav-platform-frontend:local
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    init: true

  gazebo-service:
    build:
      context: .
      dockerfile: gazebo-service/Dockerfile
    image: uav-gazebo-service:local
    env_file: .env
    environment:
      WORLD_SDF: /opt/uav/worlds/${WORLD_FILE:-empty.sdf}
      MODEL_ROOTS: /opt/uav/models
      GZ_SIM_RESOURCE_PATH: /opt/uav/models
      GZ_PARTITION: ${GZ_PARTITION:-uav-sim}
      MEDIAMTX_RTSP_HOST: localhost
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      mediamtx:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 20s
    shm_size: 1gb
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/healthz"]
      interval: 10s
      timeout: 4s
      start_period: 120s
      retries: 12

  px4-hub:
    build:
      context: .
      dockerfile: px4-hub/Dockerfile
    image: uav-px4-hub:local
    env_file: .env
    environment:
      PX4_HUB_HOST: 0.0.0.0
      PX4_HUB_PORT: 8002
      GAZEBO_API_URL: http://gazebo-service:8000
      MAX_INSTANCES: ${MAX_PX4_INSTANCES:-3}
      PX4_BINARY: /opt/PX4-Autopilot/build/px4_sitl_default/bin/px4
      GZ_PARTITION: ${GZ_PARTITION:-uav-sim}
    ports:
      - "${PX4_HUB_PORT:-8002}:8002"
    depends_on:
      gazebo-service:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: uav-platform-backend:local
    env_file: .env
    environment:
      BACKEND_HOST: 0.0.0.0
      BACKEND_PORT: 8003
      GAZEBO_API_URL: http://gazebo-service:8000
      PX4_HUB_API_URL: http://px4-hub:8002
      MEDIAMTX_API_URL: http://mediamtx:9997
      MEDIAMTX_WHEP_URL: ${MEDIAMTX_WHEP_URL:-http://localhost:8889}
      BACKEND_REQUEST_TIMEOUT: ${BACKEND_REQUEST_TIMEOUT:-30}
      BACKEND_STARTUP_TIMEOUT: ${BACKEND_STARTUP_TIMEOUT:-120}
      BACKEND_MAX_SUBSCRIPTIONS: ${BACKEND_MAX_SUBSCRIPTIONS:-32}
      MISSION_DB: /data/missions.sqlite3
      WORLD_MAP_MANIFEST: /models/${WORLD_NAME:-empty}/manifest.json
    volumes:
      - backend-missions:/data
      - ./models:/models:ro
    ports:
      - "${BACKEND_PORT:-8003}:8003"
    depends_on:
      gazebo-service:
        condition: service_healthy
      px4-hub:
        condition: service_healthy
      mediamtx:
        condition: service_started
    restart: unless-stopped
    init: true
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8003/healthz"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 3

  mediamtx:
    build:
      context: .
      dockerfile: mediamtx/Dockerfile
    image: uav-mediamtx:local
    ports:
      - "${RTSP_PORT:-8554}:8554/tcp"
      - "${RTP_PORT:-8000}:8000/udp"
      - "${RTCP_PORT:-8001}:8001/udp"
      - "${HLS_PORT:-8888}:8888/tcp"
      - "${WEBRTC_PORT:-8889}:8889/tcp"
      - "${WEBRTC_UDP_PORT:-8189}:8189/udp"
    expose:
      - "9997"
    environment:
      API_BASE: http://gazebo-service:8000
      MTX_WEBRTCALLOWORIGIN: ${WEBRTC_ALLOWED_ORIGIN:-http://localhost:3000}
      MTX_WEBRTCADDITIONALHOSTS: ${WEBRTC_ADDITIONAL_HOSTS:-localhost,mediamtx}
      MTX_WEBRTCIPSFROMINTERFACES: ${WEBRTC_IPS_FROM_INTERFACES:-no}
    restart: unless-stopped
    init: true
    stop_grace_period: 5s

networks:
  default:
    name: uav-simulation
    driver: bridge

volumes:
  backend-missions:
